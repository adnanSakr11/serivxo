name: servixo
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^5.2.0
  equatable: ^3.0.0
  flutter_bloc: ^9.1.2
  dartz: ^0.10.1
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  get_it: ^9.3.0
  google_sign_in: ^6.2.1
  logger: ^2.8.0
  shared_preferences: ^2.5.6
  permission_handler: ^13.0.2
  geolocator: ^14.1.2
  image_picker: ^1.2.4

dev_dependencies:
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"

  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  assets:
    - assets/images/


  fonts:
    - family: Judson
      fonts:
        - asset: assets/fonts/Judson-Regular.ttf
          weight: 400
        - asset: assets/fonts/Judson-Italic.ttf
          weight: 500
        - asset: assets/fonts/Judson-Bold.ttf
          weight: 700

